[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hurst-spike-risk-demo"
version = "0.1.0"
description = "Privacy-safe demo for cross-day Hurst change detection and spike-linked user capture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
]

[project.scripts]
hurst-spike-demo = "hurst_spike_risk.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

